<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlow1" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#3a2a6d"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </radialGradient>
    <linearGradient id="crystal1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#a7e8ff"/>
      <stop offset="100%" stop-color="#3d7dff"/>
    </linearGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="url(#bgGlow1)" stroke="#f4d47c" stroke-width="6"/>
  <!-- mana crystal -->
  <polygon points="100,45 130,80 118,150 82,150 70,80" fill="url(#crystal1)" stroke="#ffffff" stroke-width="3"/>
  <polygon points="100,45 130,80 100,95 70,80" fill="#d7f3ff" opacity="0.6"/>
  <!-- sparkles -->
  <g fill="#ffffff">
    <path d="M50 60 l4 10 l10 4 l-10 4 l-4 10 l-4 -10 l-10 -4 l10 -4 z"/>
    <path d="M150 55 l3 8 l8 3 l-8 3 l-3 8 l-3 -8 l-8 -3 l8 -3 z"/>
    <path d="M145 130 l3 7 l7 3 l-7 3 l-3 7 l-3 -7 l-7 -3 l7 -3 z"/>
  </g>
  <!-- three small hero orbs to represent "all heroes" -->
  <g>
    <circle cx="60" cy="150" r="10" fill="#8be0ff" stroke="#fff" stroke-width="2"/>
    <circle cx="100" cy="160" r="10" fill="#8be0ff" stroke="#fff" stroke-width="2"/>
    <circle cx="140" cy="150" r="10" fill="#8be0ff" stroke="#fff" stroke-width="2"/>
