<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGlowN1" cx="50%" cy="45%" r="65%">
      <stop offset="0%" stop-color="#1a3d4a"/>
      <stop offset="100%" stop-color="#0a1820"/>
    </radialGradient>
  </defs>
  <circle cx="100" cy="100" r="94" fill="url(#bgGlowN1)" stroke="#8a2a2a" stroke-width="6"/>
  <!-- grid -->
  <g stroke="#5aa9c9" stroke-width="3" fill="#1c3440">
    <rect x="45" y="45" width="30" height="30"/>
    <rect x="78" y="45" width="30" height="30"/>
    <rect x="111" y="45" width="30" height="30"/>
    <rect x="45" y="78" width="30" height="30"/>
    <rect x="78" y="78" width="30" height="30"/>
    <rect x="111" y="78" width="30" height="30"/>
    <rect x="45" y="111" width="30" height="30"/>
    <rect x="78" y="111" width="30" height="30"/>
    <rect x="111" y="111" width="30" height="30"/>
  </g>
  <!-- frozen middle row highlighted -->
  <g fill="#bdf2ff" opacity="0.85">
    <rect x="45" y="78" width="30" height="30"/>
    <rect x="78" y="78" width="30" height="30"/>
    <rect x="111" y="78" width="30" height="30"/>
  </g>
  <!-- big snowflake overlay -->
  <g stroke="#ffffff" stroke-width="5" stroke-linecap="round">
    <line x1="100" y1="65" x2="100" y2="135"/>
    <line x1="65" y1="100" x2="135" y2="100"/>
    <line x1="76" y1="76" x2="124" y2="124"/>
    <line x1="124" y1="76" x2="76" y2="124"/>
  </g>
</svg>
